specVersion: 1
project:
  name: commerce-service
  packageName: commerce_service
target:
  language: python
  framework: fastapi
  pythonVersion: "3.12"
  packaging: poetry
service:
  name: commerce
  description: Larger spec to exercise model, schema, repository, and use case generation
api:
  basePath: /api/v1
  endpoints:
    - name: listCustomers
      model: Customer
      path: /customers
      method: GET
      filters:
        - field: email
          op: eq
        - field: name
          op: like
        - field: created_at
          op: gte
    - name: getCustomerById
      model: Customer
      path: /customers/{id}
      method: GET
    - name: createCustomer
      model: Customer
      path: /customers
      method: POST
    - name: updateCustomer
      model: Customer
      path: /customers/{id}
      method: PATCH
    - name: deleteCustomer
      model: Customer
      path: /customers/{id}
      method: DELETE
    - name: listProducts
      model: Product
      path: /products
      method: GET
      filters:
        - field: sku
          op: eq
        - field: price
          op: lte
        - field: stock
          op: gt
    - name: createProduct
      model: Product
      path: /products
      method: POST
    - name: listOrders
      model: Order
      path: /orders
      method: GET
      filters:
        - field: customer_id
          op: eq
        - field: status
          op: in
        - field: total_amount
          op: gte
    - name: getOrderById
      model: Order
      path: /orders/{id}
      method: GET
models:
  - name: Customer
    fields:
      - name: id
        type: int
        autoIncrement: true
        primaryKey: true
      - name: email
        type: string
      - name: name
        type: string
      - name: active
        type: boolean
      - name: created_at
        type: instant
    features:
      repository: true
  - name: Product
    fields:
      - name: id
        type: uuid
      - name: sku
        type: string
      - name: name
        type: string
      - name: price
        type: decimal
      - name: stock
        type: int
      - name: active
        type: boolean
    features:
      repository: true
  - name: Order
    fields:
      - name: id
        type: uuid
      - name: customer_id
        type: uuid
      - name: status
        type: string
      - name: total_amount
        type: decimal
      - name: placed_at
        type: instant
    features:
      repository: true
