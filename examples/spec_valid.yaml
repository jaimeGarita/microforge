specVersion: 1
project:
  name: orders-service
  packageName: orders_service
target:
  language: python
  framework: fastapi
  pythonVersion: "3.12"
  packaging: poetry
service:
  name: orders
  description: Minimal valid spec
api:
  basePath: /api/v1
  endpoints:
    - name: listOrders
      path: /orders
      method: GET
models:
  - name: Order
    fields:
      - name: id
        type: uuid
        primaryKey: true
      - name: status
        type: string
      - name: parent_order_id
        type: uuid
        nullable: true
    relations:
      - name: parent_order
        type: manyToOne
        target: Order
        localField: parent_order_id
        targetField: id
    queries:
      - name: by_status
        params:
          - field: status
            op: eq
    features:
      repository: true
